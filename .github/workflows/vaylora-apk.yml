name: Vaylora APK Builder

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Android app variant to build
        required: true
        type: choice
        default: mobile
        options:
          - mobile
          - tv
          - both
  push:
    branches:
      - rebrand/vaylora-identity
    paths:
      - 'src/**'
      - 'assets/**'
      - 'native-src/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - '.github/workflows/vaylora-apk.yml'

permissions:
  contents: read

concurrency:
  group: vaylora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vaylora APKs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android CMake
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install 'cmake;3.22.1' && "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "CMake installation failed after three attempts." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build provider sandbox runtime
        run: npm run build:sandbox

      - name: Generate mobile Android project
        if: ${{ github.event_name == 'push' || inputs.variant == 'mobile' || inputs.variant == 'both' }}
        env:
          EXPO_TV: '0'
          APP_VARIANT: standalone
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build mobile debug APK
        if: ${{ github.event_name == 'push' || inputs.variant == 'mobile' || inputs.variant == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --build-cache --no-daemon --max-workers=2 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
            -Pkotlin.compiler.execution.strategy=in-process
          cd ..
          mkdir -p dist/mobile
          find android/app/build/outputs/apk/debug -type f -name '*.apk' ! -name '*androidTest*' -exec cp '{}' dist/mobile/ \;
          test -n "$(find dist/mobile -type f -name '*.apk' -print -quit)"
          ls -lh dist/mobile

      - name: Upload mobile APK
        if: ${{ success() && (github.event_name == 'push' || inputs.variant == 'mobile' || inputs.variant == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: Vaylora-mobile-APK-${{ github.run_number }}
          path: dist/mobile/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate Android TV project
        if: ${{ github.event_name == 'push' || inputs.variant == 'tv' || inputs.variant == 'both' }}
        env:
          EXPO_TV: '1'
          APP_VARIANT: tv
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android TV debug APK
        if: ${{ github.event_name == 'push' || inputs.variant == 'tv' || inputs.variant == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --build-cache --no-daemon --max-workers=2 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
            -Pkotlin.compiler.execution.strategy=in-process
          cd ..
          mkdir -p dist/tv
          find android/app/build/outputs/apk/debug -type f -name '*.apk' ! -name '*androidTest*' -exec cp '{}' dist/tv/ \;
          test -n "$(find dist/tv -type f -name '*.apk' -print -quit)"
          ls -lh dist/tv

      - name: Upload Android TV APK
        if: ${{ success() && (github.event_name == 'push' || inputs.variant == 'tv' || inputs.variant == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: Vaylora-Android-TV-APK-${{ github.run_number }}
          path: dist/tv/*.apk
          if-no-files-found: error
          retention-days: 14
